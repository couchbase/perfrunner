- &S1_warmup
  statement: SELECT c.c_w_id FROM customer c WHERE c.c_discount > $N
  suffix: &limit LIMIT 1000
  named_args:
    - &N
      name: $N
      values: [0.1, 0.495]

- <<: *S1_warmup

- &S2_warmup
  statement: SELECT c.c_w_id, c.c_d_id, c.c_id, c.c_name.c_last, c.c_name.c_first
              FROM customer c WHERE c.c_discount > $N
  suffix: *limit
  named_args:
    - *N

- <<: *S2_warmup

- &S3_warmup
  statement: "SELECT c.c_w_id,
                    c.c_d_id,
                    c.c_id,
                    c.c_name.c_last,
                    c.c_name.c_first,
                    c.c_credit,
                    c.c_credit_lim,
                    c.c_balance,
                    c.c_payment_cnt
              FROM customer c WHERE c.c_discount > $N"
  suffix: *limit
  named_args:
    - *N

- <<: *S3_warmup

- &M1_warmup
  statement: SELECT COUNT(*) FROM customer c WHERE c.c_discount > $N
  named_args:
    - *N

- <<: *M1_warmup

- &M2_warmup
  statement: SELECT SUM(c.c_balance) FROM customer c WHERE c.c_discount > $N
  named_args:
    - *N

- <<: *M2_warmup

- &M3_warmup
  statement: SELECT SUM(c.c_balance), MAX(c.c_credit_lim), AVG(c.c_payment_cnt)
              FROM customer c WHERE c.c_discount > $N
  named_args:
    - *N

- <<: *M3_warmup

- &M4_warmup
  statement: SELECT c.c_w_id, COUNT(*) FROM customer c WHERE c.c_discount > $N GROUP BY c.c_w_id
  named_args:
    - *N

- <<: *M4_warmup

- &M5_warmup
  statement: SELECT c.c_credit, SUM(c.c_balance) FROM customer c
              WHERE c.c_discount > $N GROUP BY c.c_credit
  named_args:
    - *N

- <<: *M5_warmup

- &M6_warmup
  statement: SELECT c.c_id, o.o_ol_cnt FROM customer c, orders o
              WHERE c.c_w_id = o.o_w_id
                AND c.c_d_id = o.o_d_id
                AND c.c_id = o.o_c_id
                AND o.o_entry_d > $K
  suffix: *limit
  named_args:
    - &K
      name: $K
      values: ['"2015-04-27 00:00:00"', '"2020-07-09 00:00:00"']

- <<: *M6_warmup

- &M7_warmup
  statement: SELECT c.c_id, SUM(o.o_ol_cnt) FROM customer c, orders o
              WHERE c.c_w_id = o.o_w_id
                AND c.c_d_id = o.o_d_id
                AND c.c_id = o.o_c_id
                AND c.c_discount > $N
              GROUP BY c.c_id
  named_args:
    - *N

- <<: *M7_warmup

- &M8_warmup
  statement: SELECT c.c_id, o.o_ol_cnt FROM customer c, orders o
              WHERE c.c_w_id = o.o_w_id
                AND c.c_d_id = o.o_d_id
                AND c.c_id = o.o_c_id
                AND c.c_discount > $N
                AND o.o_entry_d > $K
  suffix: *limit
  named_args:
    - *N
    - *K

- <<: *M8_warmup

- &S1
  <<: *S1_warmup
  name: S1_no_index

- &S2
  <<: *S2_warmup
  name: S2_no_index

